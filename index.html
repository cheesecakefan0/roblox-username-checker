<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Username Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 900px;
            width: 100%;
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr auto auto;
            gap: 10px;
            margin-bottom: 20px;
            align-items: end;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"],
        select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-search {
            background: #667eea;
            color: white;
        }

        .btn-search:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-search:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }

        .status.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .section {
            border: 2px solid #f0f0f0;
            border-radius: 8px;
            padding: 20px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .username-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .username-item.available {
            border-left-color: #28a745;
        }

        .username-item.unavailable {
            border-left-color: #dc3545;
        }

        .username-text {
            font-weight: 600;
            color: #333;
            flex: 1;
        }

        .status-badge {
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
        }

        .status-badge.available {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.unavailable {
            background: #f8d7da;
            color: #721c24;
        }

        .btn-action {
            padding: 6px 12px;
            margin-left: 5px;
            font-size: 12px;
        }

        .btn-keep {
            background: #28a745;
            color: white;
        }

        .btn-keep:hover {
            background: #218838;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-delete:hover {
            background: #c82333;
        }

        .empty-state {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .controls {
                grid-template-columns: 1fr;
            }

            .content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Roblox Username Checker</h1>
        <p class="subtitle">Find available usernames with your custom filters</p>

        <div class="status" id="status"></div>

        <div class="controls">
            <div class="form-group">
                <label for="character-filter">Filter by Character/Letter:</label>
                <input type="text" id="character-filter" placeholder="e.g., 'x', 'z', 'a'" maxlength="1">
            </div>

            <div class="form-group">
                <label for="username-length">Username Length:</label>
                <input type="number" id="username-length" min="3" max="20" value="5" placeholder="5">
            </div>

            <button class="btn-search" id="search-btn">Search</button>
            <button class="btn-clear" id="clear-btn">Clear All</button>
        </div>

        <div class="content">
            <div class="section">
                <h2>🔍 Available Username Found</h2>
                <div id="current-username" class="empty-state">No username found yet</div>
            </div>

            <div class="section">
                <h2>⭐ Saved Usernames</h2>
                <div id="saved-list" class="empty-state">No saved usernames yet</div>
            </div>
        </div>
    </div>

    <script>
        const characterFilterInput = document.getElementById('character-filter');
        const usernameLengthInput = document.getElementById('username-length');
        const searchBtn = document.getElementById('search-btn');
        const clearBtn = document.getElementById('clear-btn');
        const currentUsernameDiv = document.getElementById('current-username');
        const savedListDiv = document.getElementById('saved-list');
        const statusDiv = document.getElementById('status');

        let savedUsernames = JSON.parse(localStorage.getItem('robloxUsernames')) || [];
        let isSearching = false;
        let currentUsername = null;

        // Roblox API to check if username is available using CORS proxy
        async function isUsernameAvailable(username) {
            try {
                // Using CORS proxy to bypass CORS restrictions
                const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
                const apiUrl = `https://api.roblox.com/users/get-by-username?username=${encodeURIComponent(username)}`;
                
                const response = await fetch(proxyUrl + apiUrl, {
                    method: 'GET',
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                // If status is 200, username is taken
                // If status is 404, username is available
                return response.status === 404;
            } catch (error) {
                console.error('Error checking username:', error);
                // Retry with alternative method
                return await checkUsernameAlternative(username);
            }
        }

        // Alternative method using allorigins proxy
        async function checkUsernameAlternative(username) {
            try {
                const apiUrl = `https://api.roblox.com/users/get-by-username?username=${encodeURIComponent(username)}`;
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;
                
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                // If contents include error or 404, username is available
                if (data.contents.includes('not found') || data.contents.includes('404')) {
                    return true;
                }
                // If contents include user data, username is taken
                return false;
            } catch (error) {
                console.error('Alternative check failed:', error);
                return null;
            }
        }

        function generateRandomUsername(length, filterChar) {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789_';
            let username = '';

            // If filter is set, ensure it's included
            if (filterChar) {
                username = filterChar;
                for (let i = 1; i < length; i++) {
                    username += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                // Shuffle to randomize position
                username = username.split('').sort(() => Math.random() - 0.5).join('');
            } else {
                for (let i = 0; i < length; i++) {
                    username += chars.charAt(Math.floor(Math.random() * chars.length));
                }
            }

            return username.substring(0, length);
        }

        function showStatus(message, type) {
            statusDiv.innerHTML = message;
            statusDiv.className = `status ${type}`;
            if (type !== 'info') {
                setTimeout(() => {
                    statusDiv.className = 'status';
                }, 3000);
            }
        }

        async function searchUsername() {
            const length = parseInt(usernameLengthInput.value) || 5;
            const filterChar = characterFilterInput.value.toLowerCase() || null;

            if (length < 3 || length > 20) {
                showStatus('Username length must be between 3 and 20 characters', 'error');
                return;
            }

            isSearching = true;
            searchBtn.disabled = true;
            showStatus('<span class="loader"></span>🔍 Searching for available username...', 'info');

            let attempts = 0;
            const maxAttempts = 50;
            let foundUsername = false;

            while (attempts < maxAttempts && isSearching && !foundUsername) {
                const username = generateRandomUsername(length, filterChar);
                attempts++;

                showStatus(`<span class="loader"></span>🔍 Searching... Attempt ${attempts}/${maxAttempts}`, 'info');

                const available = await isUsernameAvailable(username);

                if (available === null) {
                    // Retry on network error
                    continue;
                }

                if (available) {
                    currentUsername = username;
                    displayCurrentUsername(username, true);
                    showStatus(`✅ Found available username: <strong>${username}</strong>`, 'success');
                    foundUsername = true;
                    break;
                }

                // Small delay to avoid rate limiting
                await new Promise(resolve => setTimeout(resolve, 300));
            }

            if (!foundUsername && isSearching) {
                showStatus(`Searched ${maxAttempts} usernames, none were available. Try again!`, 'error');
                displayCurrentUsername(null, false);
            }

            isSearching = false;
            searchBtn.disabled = false;
        }

        function displayCurrentUsername(username, isAvailable) {
            if (!username) {
                currentUsernameDiv.innerHTML = '<div class="empty-state">No username found yet</div>';
                return;
            }

            currentUsernameDiv.innerHTML = `
                <div class="username-item ${isAvailable ? 'available' : 'unavailable'}">
                    <div>
                        <span class="status-badge ${isAvailable ? 'available' : 'unavailable'}">
                            ${isAvailable ? '✓ AVAILABLE' : '✗ TAKEN'}
                        </span>
                        <span class="username-text">${username}</span>
                    </div>
                    <div>
                        <button class="btn-action btn-keep" onclick="keepUsername('${username}')">Keep</button>
                        <button class="btn-action btn-delete" onclick="discardUsername()">Discard</button>
                    </div>
                </div>
            `;
        }

        function keepUsername(username) {
            if (!savedUsernames.includes(username)) {
                savedUsernames.push(username);
                localStorage.setItem('robloxUsernames', JSON.stringify(savedUsernames));
                displaySavedUsernames();
                showStatus(`✅ "${username}" saved to your list!`, 'success');
                discardUsername();
            }
        }

        function deleteUsername(username) {
            savedUsernames = savedUsernames.filter(u => u !== username);
            localStorage.setItem('robloxUsernames', JSON.stringify(savedUsernames));
            displaySavedUsernames();
            showStatus(`🗑️ "${username}" deleted from your list`, 'success');
        }

        function discardUsername() {
            currentUsername = null;
            displayCurrentUsername(null, false);
        }

        function displaySavedUsernames() {
            if (savedUsernames.length === 0) {
                savedListDiv.innerHTML = '<div class="empty-state">No saved usernames yet</div>';
                return;
            }

            savedListDiv.innerHTML = savedUsernames.map(username => `
                <div class="username-item available">
                    <span class="username-text">${username}</span>
                    <div>
                        <button class="btn-action btn-delete" onclick="deleteUsername('${username}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function clearAll() {
            if (confirm('Are you sure you want to delete all saved usernames?')) {
                savedUsernames = [];
                localStorage.setItem('robloxUsernames', JSON.stringify(savedUsernames));
                displaySavedUsernames();
                discardUsername();
                showStatus('✅ All usernames cleared', 'success');
            }
        }

        // Event listeners
        searchBtn.addEventListener('click', searchUsername);
        clearBtn.addEventListener('click', clearAll);

        characterFilterInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUsername();
        });

        usernameLengthInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchUsername();
        });

        // Initial display
        displaySavedUsernames();
    </script>
</body>
</html>
